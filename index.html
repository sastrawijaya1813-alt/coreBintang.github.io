<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>coreBintang - Login v1.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-login">

    <div class="login-wrapper">
        <div class="logo-login">
            <div class="panah-gabung">
                <span class="core">core</span><span class="bintang-text">Bintang</span>
                
            </div>
        </div>
        <p class="judul-login">login</p>

        <div class="kotak-hitam-login">
            <label>Nama:</label>
            <input type="text" id="nama" autocomplete="off">
            <label>kata sandi:</label>
            <input type="password" id="sandi">
            
            <button class="btn-masuk" onclick="cekLogin()">masuk</button>
            <p id="pesan-error"></p>

            <div class="pesan-bawah">
                maaf untuk masuk coreBintang hanya keluarga saya saja untuk yang lain tidak.
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
